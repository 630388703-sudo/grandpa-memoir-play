<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>爷爷的时光 · 家人入口</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4f0e5;color:#424936;font:17px/1.7 system-ui,sans-serif;padding:30px}main{width:min(100%,400px)}.leaf{font-size:30px;color:#a66b43}h1{font:normal 42px/1.5 'Songti SC',SimSun,serif;margin:12px 0}p{color:#817e70;margin:0 0 36px}label{display:block;font-size:16px;margin-bottom:10px}input{width:100%;padding:15px;border:1px solid #b3b39e;border-radius:8px;background:#fbf9f2;font:20px system-ui;letter-spacing:.12em;color:#424936}input:focus{outline:2px solid #687655;outline-offset:2px}button{margin-top:20px;width:100%;border:0;border-radius:8px;background:#424936;color:#fff;padding:15px;font-size:17px;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.note{margin-top:28px;font-size:14px}.status{color:#943d2e;margin:12px 0 0;min-height:26px;font-size:15px}</style>
</head>
<body><main><span class="leaf" aria-hidden="true">❧</span><h1>爷爷的时光</h1><p>留给家人的一段时光。</p>
<form id="unlockForm"><label for="password">请输入家人之间的密码</label><input id="password" type="password" autocomplete="off" required maxlength="128"><div class="status" id="status" role="status" aria-live="polite"></div><button id="enter" type="submit">进去陪爷爷走走 →</button></form>
<p class="note">照片与回忆，在输入密码后展开。</p><noscript>请使用支持 JavaScript 的浏览器打开。</noscript></main>
<script src="unlock.js"></script></body></html>
